name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # 工具层测试，不安装 ROS；不能替代 Humble/Jazzy 的构建与运行验证。
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff 检查
        run: ruff check scripts tests

      - name: 编译检查
        run: python -m compileall scripts tests

      - name: 单元测试
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: 关键文件检查
        run: python scripts/validate_project.py
